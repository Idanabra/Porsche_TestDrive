  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\"{{ notSigned }}\" on-click=\"{{ printDoc }}\" hint-size=\"160px,36px\">אישור והפקת PDF<\u002Fx-import>\n      <\u002Fdiv>\n      <article data-print-doc=\"1\" style=\"width:100%;max-width:880px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:var(--sapContent_Shadow1);padding:40px 48px 28px;display:flex;flex-direction:column;gap:24px;color:#131e29;font-size:14px;line-height:1.55\">\n        <header style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #131e29;padding-bottom:16px\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <div style=\"font-weight:700;font-size:22px;letter-spacing:.01em\">טופס נסיעת מבחן – בדיקת רכב<\u002Fdiv>\n            <div style=\"color:#556b82\">אורכיד ספורטס קארס ישראל בע״מ<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:2px;text-align:left;font-size:13px;color:#556b82\">\n            <span style=\"font-weight:700;letter-spacing:.18em;color:#131e29;font-size:15px\">PORSCHE<\u002Fspan>\n            <span>מסמך מס׳ <span style=\"font-family:var(--sapContent_MonospaceFontFamily)\">{{ docNo }}<\u002Fspan><\u002Fspan>\n            <span>הופק: {{ todayStr }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fheader>\n\n        <section style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-weight:700;font-size:15px\">פרטי לקוח<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));border:1px solid #d9dee3;border-radius:8px;overflow:hidden\">\n            <sc-for list=\"{{ docCustomer }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-bottom:1px solid #eef0f2\">\n                <span style=\"font-size:12px;color:#556b82\">{{ r.k }}<\u002Fspan>\n                <span style=\"font-weight:600\">{{ r.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-weight:700;font-size:15px\">פרטי רכב ונסיעה<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));border:1px solid #d9dee3;border-radius:8px;overflow:hidden\">\n            <sc-for list=\"{{ docTrip }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-bottom:1px solid #eef0f2\">\n                <span style=\"font-size:12px;color:#556b82\">{{ r.k }}<\u002Fspan>\n                <span style=\"font-weight:600\">{{ r.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-weight:700;font-size:15px\">הצהרת הלקוח<\u002Fdiv>\n          <p style=\"margin:0;text-wrap:pretty\">אני החתום מטה <strong>{{ f.name }}<\u002Fstrong> מאשר בחתימתי את קבלת הרכב הנ\"ל לפי הפרטים הנ\"ל וכי האחריות על הרכב היא באחריותי הבלעדית לרבות דוחות תעבורה, תאונות, וכל היוצא בזאת בכל מהלך התקופה המפורטת הנ\"ל. השתתפות עצמית במקרה של תאונה: עד {{ deductible }} ₪.<\u002Fp>\n          <ul style=\"margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:2px\">\n            <li>ידוע לי כי הרכב מבוטח לנהגים מעל גיל 30 בלבד.<\u002Fli>\n            <li>ידוע לי כי אין להיכנס עם הרכב לכבישי אגרה, וכי חל איסור מוחלט לרדת מדרך סלולה.<\u002Fli>\n            <li>ידוע לי כי אין לעשן ברכב.<\u002Fli>\n          <\u002Ful>\n        <\u002Fsection>\n\n        <section style=\"display:flex;flex-direction:column;gap:8px\">\n          <div style=\"font-weight:700;font-size:15px\">הסכמה לשמירת מידע<\u002Fdiv>\n          <p style=\"margin:0\">אני החתום מטה, מצהיר ומאשר בזאת כדלקמן:<\u002Fp>\n          <ol style=\"margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:2px;text-wrap:pretty\">\n            <li>במסגרת נסיעת המבחן מסרתי לחברה את פרטיי האישיים, לרבות צילום תעודת זהות, לצורך זיהוי, ביצוע הנסיעה ויצירת קשר עמי.<\u002Fli>\n            <li>פרטי ומידע כאמור יישמרו וינוהלו במאגר מידע כדין של החברה, וישמשו לצורך מתן שירות, עדכונים ופניות בהתאם לדין.<\u002Fli>\n            <li>אני מודע לכך שלא חלה עלי כל חובה חוקית למסור מידע כלשהו.<\u002Fli>\n          <\u002Fol>\n        <\u002Fsection>\n\n        <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\">\n              <span style=\"font-weight:700\">חתימת הלקוח<\u002Fspan>\n              <span data-no-print=\"1\">\n                <x-import component-from-global-scope=\"SAPHorizonDesignSystem_f0bcbb.Button\" design=\"transparent\" size=\"compact\" icon=\"eraser\" on-click=\"{{ clearSig }}\" hint-size=\"80px,26px\">ניקוי<\u002Fx-import>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position:relative;height:150px;border:1px {{ sigBorderStyle }} {{ sigBorderColor }};border-radius:8px;background:#fafbfc;overflow:hidden\">\n              <canvas ref=\"{{ sigRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair\"><\u002Fcanvas>\n              <sc-if value=\"{{ notSigned }}\" hint-placeholder-val=\"{{ true }}\">\n                <span data-no-print=\"1\" style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8396a8;pointer-events:none\">חתמו כאן באצבע או בעט<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#556b82;border-top:1px solid #131e29;padding-top:6px\"><span>{{ f.name }} · ת.ז {{ f.idNum }}<\u002Fspan><span>{{ todayStr }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"display:flex;align-items:center;min-height:26px\"><span style=\"font-weight:700\">חתימת יועץ המכירות<\u002Fspan><\u002Fdiv>\n            <div style=\"position:relative;height:150px;border:1px solid #d9dee3;border-radius:8px;background:#fafbfc;display:flex;align-items:center;justify-content:center\">\n              <span style=\"font-family:'Amatic SC',cursive;font-weight:700;font-size:52px;color:#1b3a8c;transform:rotate(-4deg)\">{{ salesName }}<\u002Fspan>\n              <span style=\"position:absolute;bottom:8px;left:10px;font-size:11px;color:#556b82\">נחתם דיגיטלית<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:12px;color:#556b82;border-top:1px solid #131e29;padding-top:6px\"><span>{{ salesName }} · יועץ מכירות<\u002Fspan><span>{{ todayStr }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <footer style=\"margin-top:8px;border-top:1px solid #d9dee3;padding-top:12px;display:flex;flex-direction:column;gap:2px;font-size:11px;color:#556b82;text-align:center;line-height:1.6\">\n          <div style=\"font-weight:700;color:#131e29;font-size:12px\">אורכיד ספורטס קארס ישראל בע״מ<\u002Fdiv>\n          <div>הנהלה ואולם תצוגה – החושלים 8 הרצליה, מיקוד 4672408 | ת.ד. 12382 | טלפון 09-7722911 | פקס 09-7744911 | www.porsche.co.il<\u002Fdiv>\n          <div>מרכז שירות – ז׳בוטינסקי 101 פינת אינשטיין פתח תקווה, מיקוד 4925006 | טלפון 03-9190911<\u002Fdiv>\n        <\u002Ffooter>\n      <\u002Farticle>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CARS = {\n  '911 Carrera': ['12-345-67', '45-812-90'],\n  '911 Carrera 4 GTS': ['78-221-34'],\n  '911 Turbo S': ['33-905-18'],\n  'Taycan 4S': ['61-447-02', '61-448-15'],\n  'Taycan Turbo': ['90-113-47'],\n  'Macan Electric': ['27-650-83', '27-651-96'],\n  'Cayenne E-Hybrid': ['54-309-71'],\n  'Panamera 4': ['88-742-26']\n};\nconst SAMPLE = { name: 'ישראל ישראלי', idNum: '039581246', address: 'רחוב הרצל 12, תל אביב-יפו' };\nconst pad = n => String(n).padStart(2, '0');\nconst isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\nconst hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;\nconst heDate = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };\n\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    const now = new Date(); const later = new Date(now.getTime() + 60 * 60000);\n    this.state = {\n      step: 1, scan: 'none', idImg: null, idFileName: '', isPdf: false, isSample: false,\n      f: { name: '', idNum: '', address: '', phone: '', email: '' },\n      car: { model: '', plate: '' },\n      trip: { kmOut: '', kmIn: '', dOut: isoDate(now), tOut: hhmm(now), dIn: isoDate(later), tIn: hhmm(later) },\n      tried1: false, tried2: false, signed: false,\n      docNo: 'TD-' + now.getFullYear() + '-' + String(Math.floor(1000 + Math.random() * 9000))\n    };\n    this.camRef = React.createRef(); this.fileRef = React.createRef();\n    this.sigRef = el => { if (el && el !== this.cv) { this.cv = el; this.setupSig(el); } };\n  }\n  componentWillUnmount() { clearTimeout(this.t); }\n  setupSig(cv) {\n    const fit = () => {\n      const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;\n      if (!r.width) return;\n      const data = this.state.signed ? cv.toDataURL() : null;\n      cv.width = r.width * dpr; cv.height = r.height * dpr;\n      const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);\n      c.lineWidth = 2.4; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#131e29';\n      if (data) { const im = new Image(); im.onload = () => c.drawImage(im, 0, 0, r.width, r.height); im.src = data; }\n    };\n    requestAnimationFrame(fit);\n    let drawing = false, last = null;\n    const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };\n    cv.addEventListener('pointerdown', e => { drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId);\n      const c = cv.getContext('2d'); c.beginPath(); c.arc(last[0], last[1], 1.2, 0, 7); c.fillStyle = '#131e29'; c.fill(); });\n    cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e), c = cv.getContext('2d');\n      c.beginPath(); c.moveTo(last[0], last[1]); c.lineTo(p[0], p[1]); c.stroke(); last = p;\n      if (!this.state.signed) this.setState({ signed: true }); });\n    const end = () => { drawing = false; };\n    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);\n  }\n  clearSig = () => { if (this.cv) { const c = this.cv.getContext('2d'); c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, this.cv.width, this.cv.height); c.restore(); } this.setState({ signed: false }); };\n  startScan(patch) {\n    clearTimeout(this.t);\n    this.setState({ ...patch, scan: 'scanning' });\n    this.t = setTimeout(() => this.setState(s => ({ scan: 'done', f: { ...s.f, ...SAMPLE } })), 1800);\n  }\n  onFile = e => {\n    const file = e.target.files && e.target.files[0]; if (!file) return;\n    const isPdf = file.type === 'application/pdf';\n    if (this.state.idImg) URL.revokeObjectURL(this.state.idImg);\n    this.startScan({ idImg: isPdf ? null : URL.createObjectURL(file), idFileName: file.name, isPdf, isSample: false });\n    e.target.value = '';\n  };\n  validate1() {\n    const f = this.state.f, e = {};\n    if (!f.name.trim()) e.name = 'שדה חובה';\n    if (!/^\\d{9}$/.test(f.idNum.trim())) e.idNum = f.idNum ? 'ת.ז חייבת לכלול 9 ספרות' : 'שדה חובה';\n    if (!f.address.trim()) e.address = 'שדה חובה';\n    const ph = f.phone.replace(/[\\s-]/g, '');\n    if (!/^0\\d{8,9}$/.test(ph)) e.phone = f.phone ? 'מספר טלפון לא תקין' : 'שדה חובה';\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(f.email.trim())) e.email = f.email ? 'כתובת דוא\"ל לא תקינה' : 'שדה חובה';\n    return e;\n  }\n  validate2() {\n    const { car, trip } = this.state, e = {};\n    if (!car.model) e.model = true;\n    if (!car.plate) e.plate = true;\n    ['kmOut', 'dOut', 'tOut', 'dIn', 'tIn'].forEach(k => { if (!trip[k]) e[k] = true; });\n    if (trip.kmIn !== '' && trip.kmOut !== '' && Number(trip.kmIn) < Number(trip.kmOut)) e.kmIn = true;\n    if (trip.dIn && trip.dOut && trip.tIn && trip.tOut && (trip.dIn + trip.tIn) <= (trip.dOut + trip.tOut)) { e.dIn = true; e.tIn = true; e.order = true; }\n    return e;\n  }\n  renderVals() {\n    const s = this.state, step = s.step;\n    const salesName = this.props.salesName ?? 'אבי לוי';\n    const e1 = s.tried1 ? this.validate1() : {};\n    const e2 = s.tried2 ? this.validate2() : {};\n    const scanMissing = s.tried1 && s.scan !== 'done';\n    const set = (grp, k) => ev => { const v = ev.target.value; this.setState(st => ({ [grp]: { ...st[grp], [k]: v } })); };\n    const on = {\n      name: set('f', 'name'), idNum: set('f', 'idNum'), address: set('f', 'address'), phone: set('f', 'phone'), email: set('f', 'email'),\n      model: ev => { const v = ev.target.value; const pl = CARS[v] || []; this.setState(st => ({ car: { model: v, plate: pl.length === 1 ? pl[0] : '' } })); },\n      plate: set('car', 'plate'),\n      kmOut: set('trip', 'kmOut'), kmIn: set('trip', 'kmIn'), dOut: set('trip', 'dOut'), tOut: set('trip', 'tOut'), dIn: set('trip', 'dIn'), tIn: set('trip', 'tIn')\n    };\n    const vs = {}, err = {};\n    ['name', 'idNum', 'address', 'phone', 'email'].forEach(k => { vs[k] = e1[k] ? 'Error' : 'None'; err[k] = e1[k] || ''; });\n    const vs2 = {};\n    ['kmOut', 'kmIn', 'dOut', 'tOut', 'dIn', 'tIn'].forEach(k => { vs2[k] = e2[k] ? 'Error' : 'None'; });\n    const err2 = { model: !!e2.model, plate: !!e2.plate, dInText: e2.order ? 'ההחזרה חייבת להיות אחרי המסירה' : 'שדה חובה', tInText: e2.order ? ' ' : 'שדה חובה' };\n    const ok1 = s.scan === 'done' && !Object.keys(this.validate1()).length;\n    const ok2 = !Object.keys(this.validate2()).length;\n    const avail = n => n === 1 || (n === 2 && ok1) || (n === 3 && ok1 && ok2);\n    const goTo = n => {\n      if (n === step) return;\n      if (n < step || avail(n)) { if (n === 3) this.cv = null; this.setState({ step: n, ...(n === 3 ? { signed: false } : {}) }); return; }\n      if (!ok1) this.setState({ tried1: true, step: 1 }); else this.setState({ tried2: true, step: 2 });\n    };\n    const titles = [['פרטי לקוח', 'סריקת ת.ז ופרטי קשר'], ['פרטי נסיעה', 'רכב, ק\"מ ומועדים'], ['חתימה ואישור', 'סיכום והפקת מסמך']];\n    const steps = titles.map(([title, sub], i) => {\n      const n = i + 1, cur = n === step, done = n < step, open = !cur && !done && avail(n);\n      return { num: n, title, sub, done, notDone: !done, notLast: n < 3,\n        bg: done || cur ? 'var(--sapButton_Emphasized_Background)' : 'var(--sapTileBackground,#fff)',\n        fg: done || cur ? '#fff' : open ? 'var(--sapButton_Emphasized_Background)' : 'var(--sapContent_LabelColor)',\n        bd: done || cur || open ? 'var(--sapButton_Emphasized_Background)' : 'var(--sapField_BorderColor)',\n        hint: open ? 'מעבר לשלב ' + n : '',\n        weight: cur ? 700 : 400, line: done ? 'var(--sapButton_Emphasized_Background)' : 'var(--sapList_BorderColor,#e5e5e5)',\n        cursor: cur ? 'default' : 'pointer', go: () => goTo(n) };\n    });\n    const next = () => {\n      if (step === 1) {\n        this.setState({ tried1: true });\n        if (s.scan !== 'done' || Object.keys(this.validate1()).length) return;\n        this.setState({ step: 2 });\n      } else if (step === 2) {\n        this.setState({ tried2: true });\n        if (Object.keys(this.validate2()).length) return;\n        this.cv = null; this.setState({ step: 3, signed: false });\n      }\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n    };\n    const t = s.trip, now = new Date();\n    const plates = CARS[s.car.model] || [];\n    return {\n      step, isStep1: step === 1, isStep2: step === 2, isStep3: step === 3, notStep3: step !== 3, canBack: step > 1,\n      steps, docNo: s.docNo, salesName, salesInitials: salesName.split(' ').map(w => w[0]).join(''),\n      cardBody: { padding: '4px 16px 20px' },\n      f: s.f, on, vs, err, notScanned: s.scan !== 'done', fromIdPh: s.scan === 'scanning' ? 'מחלץ נתונים…' : 'ימולא מסריקת ת.ז', manualPh: s.scan === 'scanning' ? 'מחלץ נתונים…' : 'הזנה ידנית או סריקת ת.ז', stripStyle: { flex: '1 1 320px' },\n      idIcon: s.scan === 'done' ? 'business-card' : undefined,\n      camRef: this.camRef, fileRef: this.fileRef, onFile: this.onFile,\n      openCam: () => this.camRef.current && this.camRef.current.click(),\n      openFile: () => this.fileRef.current && this.fileRef.current.click(),\n      useSample: () => this.startScan({ idImg: null, isPdf: false, isSample: true, idFileName: '' }),\n      demo: this.props.showSampleScan ?? true,\n      scanNone: s.scan === 'none', hasScanView: s.scan !== 'none', scanning: s.scan === 'scanning', scanDone: s.scan === 'done', scanMissing,\n      showImg: !!s.idImg, showPdf: s.isPdf, showSample: s.isSample, idImg: s.idImg, idImgBg: s.idImg ? `url(\"${s.idImg}\")` : 'none', idFileName: s.idFileName, sample: SAMPLE,\n      scanBeam: React.createElement('span', { key: 'beam', style: { position: 'absolute', left: 0, right: 0, height: 2, background: 'var(--sapButton_Emphasized_Background)', boxShadow: '0 0 12px 2px rgba(0,112,242,.6)', animation: 'scanline 1.2s ease-in-out infinite alternate' } }),\n      car: s.car, trip: t, vs2, err2, models: Object.keys(CARS), plates, noModel: !s.car.model,\n      plateOpacity: s.car.model ? 1 : 0.5, platePh: s.car.model ? 'בחרו מספר רישוי' : 'בחרו דגם תחילה',\n      selBd: { model: e2.model ? 'var(--sapErrorBorderColor)' : 'var(--sapField_BorderColor)', plate: e2.plate ? 'var(--sapErrorBorderColor)' : 'var(--sapField_BorderColor)' },\n      next, back: () => { this.setState({ step: step - 1 }); }, nextLabel: 'הבא',\n      todayStr: `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`,\n      deductible: (this.props.deductible ?? 10000).toLocaleString('he-IL'),\n      docCustomer: [{ k: 'שם מלא', v: s.f.name }, { k: 'ת.ז', v: s.f.idNum }, { k: 'כתובת מגורים', v: s.f.address }, { k: 'טלפון', v: s.f.phone }, { k: 'דוא\"ל', v: s.f.email }],\n      docTrip: [{ k: 'דגם', v: 'Porsche ' + s.car.model }, { k: 'מספר רישוי', v: s.car.plate }, { k: 'ק\"מ במסירה', v: t.kmOut ? Number(t.kmOut).toLocaleString('he-IL') : '—' }, { k: 'ק\"מ בחזרה', v: t.kmIn ? Number(t.kmIn).toLocaleString('he-IL') : '—' },\n        { k: 'מסירה', v: heDate(t.dOut) + ' · ' + t.tOut }, { k: 'החזרה', v: heDate(t.dIn) + ' · ' + t.tIn }],\n      sigRef: this.sigRef, clearSig: this.clearSig, notSigned: !s.signed,\n      sigBorderStyle: s.signed ? 'solid' : 'dashed', sigBorderColor: s.signed ? '#d9dee3' : 'var(--sapField_BorderColor)',\n      signStripDesign: s.signed ? 'Positive' : 'Information',\n      signStripText: s.signed ? 'המסמך נחתם. ניתן להפיק PDF.' : 'יש לעבור על פרטי המסמך עם הלקוח ולהחתים אותו על גבי הטאבלט.',\n      printDoc: () => window.print()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
